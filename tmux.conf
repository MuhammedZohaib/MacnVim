# =============================================================================
# tmux.conf — Terminal-first dev environment + Kanagawa theme
# =============================================================================

# ── Prefix ───────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── General ──────────────────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"

# Truecolor support for iTerm2 + tmux + Neovim
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",tmux-256color:RGB"
set -ag terminal-overrides ",xterm-256color:Tc"
set -ag terminal-overrides ",tmux-256color:Tc"

set -g history-limit 50000
set -g display-time 4000
set -g status-interval 5
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g mouse on
set -g set-clipboard on
set -sg escape-time 0
set -g focus-events on
set -g mode-keys vi

# ── Keybindings ──────────────────────────────────────────────────────────────
# Reload config
bind r source-file ~/.tmux.conf \; display "tmux config reloaded!"

# Split panes while keeping current working directory
bind "|" split-window -h -c "#{pane_current_path}"
bind "-" split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current working directory
bind c new-window -c "#{pane_current_path}"

# Vim-like pane navigation
# C-h/j/k/l handled by vim-tmux-navigator plugin
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + Shift-h/j/k/l
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Move between windows
bind -r [ previous-window
bind -r ] next-window
bind Tab last-window

# Fuzzy session switcher popup
bind C-s display-popup -E -w 50% -h 40% \
  "tmux list-sessions -F '#{session_name}' | sed '/^'\"$(tmux display -p '#S')\"'$/d' | fzf --reverse --header='Switch session' | xargs -r tmux switch-client -t"

# Kill pane/window without confirmation
bind x kill-pane
bind X kill-window

# Swap windows
bind -r "<" swap-window -d -t -1
bind -r ">" swap-window -d -t +1

# ── Copy mode — vi ───────────────────────────────────────────────────────────
bind Enter copy-mode
bind -T copy-mode-vi v   send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y   send -X copy-selection-and-cancel
bind -T copy-mode-vi H   send -X start-of-line
bind -T copy-mode-vi L   send -X end-of-line

# ── Dev Layouts ──────────────────────────────────────────────────────────────
# <prefix> D → quick full-screen dev layout
bind D new-session -A -s dev \; \
  new-window -n "code" \; \
  split-window -h -p 30 \; \
  select-pane -L \; \
  send-keys "nvim ." Enter \; \
  select-pane -R

# =============================================================================
# Theme — Kanagawa (synced with Neovim rebelot/kanagawa.nvim)
# =============================================================================
source-file ~/.config/tmux/themes/kanagawa.tmux

# ── Plugins — TPM ────────────────────────────────────────────────────────────
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-resurrect"
set -g @plugin "tmux-plugins/tmux-continuum"
set -g @plugin "tmux-plugins/tmux-yank"
set -g @plugin "christoomey/vim-tmux-navigator"

# Resurrect / Continuum
set -g @resurrect-capture-pane-contents "on"
set -g @continuum-restore "off"
set -g @continuum-save-interval "10"

# Initialize TPM — keep at bottom
run "~/.tmux/plugins/tpm/tpm"
